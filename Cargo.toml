[package]
name = "anvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "anvil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = "51.0.0-rc.1"


[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
