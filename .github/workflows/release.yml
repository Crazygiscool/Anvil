name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build static release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check that the binary is statically linked
        run: |
          set -eu
          file "target/${{ matrix.target }}/release/anvil"
          # A musl target must not carry a dynamic dependency; if it does,
          # the release would not run on a minimal homelab host.
          if ldd "target/${{ matrix.target }}/release/anvil" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            ldd "target/${{ matrix.target }}/release/anvil"
            exit 1
          fi

      - name: Stage binary
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/anvil" "dist/anvil-${{ matrix.target }}"
          # The checksum file has to name the asset itself, not the path it
          # happens to have in the build directory, so that
          # `sha256sum -c` works in the directory a user downloaded it into.
          (cd dist && sha256sum "anvil-${{ matrix.target }}" > "anvil-${{ matrix.target }}.sha256")

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Anvil ${{ github.ref_name }}
          body: |
            Anvil is a single static binary for Linux that reads the state of a
            homelab host and lets you change it, deliberately.

            ## What is in this release

            This is a follow-up to v0.2.0. It fixes what that release got
            wrong and completes what it left half done.

            - **The init services are real.** `systemctl list-units` and
              `rc-status --all` are parsed into the services the init system
              reports, with the state it reports. The runtime tab lists them
              and offers start, stop and restart, which go through
              `systemctl` and `rc-service` behind the same privilege gate as
              every other mutation.
            - **`anvil runtime` prints the services**, so the command-line
              report says the same thing the tab shows.
            - **An install pulls the image first.** The Docker API does not
              fetch an image when a container is created — it answers "no
              such image". A catalog install on a host that did not already
              have the image failed; it works now.
            - **The exit code says what went wrong.** 2 for a configuration
              problem, 3 for a permission problem, 1 for a runtime failure.
              Before this, every failure was 1.
            - **The dead code is gone.** The tree carried five blanket
              `#![allow(dead_code)]` suppressions that hid code nothing
              called. It carries none now.

            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/Crazygiscool/Anvil/main/scripts/install.sh | sh
            ```

            ## Verify

            Both binaries are statically linked against musl:

            ```sh
            file anvil-x86_64-unknown-linux-musl
            sha256sum -c anvil-x86_64-unknown-linux-musl.sha256
            ```

            ## Safety

            `apply` requires `--dry-run` and never changes the host. The
            inspection commands are read-only. Real mutations need root and
            `ANVIL_ALLOW_MUTATION=1`.

            The full history is in `CHANGELOG.md`.
          files: |
            dist/anvil-${{ matrix.target }}
            dist/anvil-${{ matrix.target }}.sha256
