name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build static release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check that the binary is statically linked
        run: |
          set -eu
          file "target/${{ matrix.target }}/release/anvil"
          # A musl target must not carry a dynamic dependency; if it does,
          # the release would not run on a minimal homelab host.
          if ldd "target/${{ matrix.target }}/release/anvil" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            ldd "target/${{ matrix.target }}/release/anvil"
            exit 1
          fi

      - name: Stage binary
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/anvil" "dist/anvil-${{ matrix.target }}"
          # The checksum file has to name the asset itself, not the path it
          # happens to have in the build directory, so that
          # `sha256sum -c` works in the directory a user downloaded it into.
          (cd dist && sha256sum "anvil-${{ matrix.target }}" > "anvil-${{ matrix.target }}.sha256")

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Anvil ${{ github.ref_name }}
          body: |
            Anvil is a single static binary for Linux that reads the state of a
            homelab host and lets you change it, deliberately.

            ## What is in this release

            This is a follow-up to v0.2.1. It makes the interface keep up with
            the hand.

            - **A keystroke is handled when it happens.** The terminal is read
              on a thread of its own. Before this, the event loop polled for
              input once per refresh tick and read a single event per tick, so
              every key waited up to a second and a held-down key moved the
              cursor one row per second.
            - **The screen is redrawn when something changed**, not on a timer:
              a handled key, a new telemetry sample, a refreshed host report.
            - **A frame only builds what changed.** The rows are built again
              when the host state moved, and the detail pane when the selected
              item changed. A frame that changes nothing builds nothing. The
              runtime tab went from ~150 us per frame to ~260 ns.
            - **The detail pane follows the selected item by identity**, not by
              row, so a filter or a sort that puts another item under the
              cursor shows that item.

            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/Crazygiscool/Anvil/main/scripts/install.sh | sh
            ```

            ## Verify

            Both binaries are statically linked against musl:

            ```sh
            file anvil-x86_64-unknown-linux-musl
            sha256sum -c anvil-x86_64-unknown-linux-musl.sha256
            ```

            ## Safety

            `apply` requires `--dry-run` and never changes the host. The
            inspection commands are read-only. Real mutations need root and
            `ANVIL_ALLOW_MUTATION=1`.

            The full history is in `CHANGELOG.md`.
          files: |
            dist/anvil-${{ matrix.target }}
            dist/anvil-${{ matrix.target }}.sha256
