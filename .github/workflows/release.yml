name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl cross toolchain
        uses: messense/rust-musl-cross-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build static release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check that the binary is statically linked
        run: |
          set -eu
          file "target/${{ matrix.target }}/release/anvil"
          # A musl target must not carry a dynamic dependency; if it does,
          # the release would not run on a minimal homelab host.
          if ldd "target/${{ matrix.target }}/release/anvil" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            ldd "target/${{ matrix.target }}/release/anvil"
            exit 1
          fi

      - name: Stage binary
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/anvil" "dist/anvil-${{ matrix.target }}"
          sha256sum "dist/anvil-${{ matrix.target }}" > "dist/anvil-${{ matrix.target }}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/anvil-${{ matrix.target }}
            dist/anvil-${{ matrix.target }}.sha256
