name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl cross toolchain
        uses: messense/rust-musl-cross-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build static release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check that the binary is statically linked
        run: |
          set -eu
          file "target/${{ matrix.target }}/release/anvil"
          # A musl target must not carry a dynamic dependency; if it does,
          # the release would not run on a minimal homelab host.
          if ldd "target/${{ matrix.target }}/release/anvil" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            ldd "target/${{ matrix.target }}/release/anvil"
            exit 1
          fi

      - name: Stage binary
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/anvil" "dist/anvil-${{ matrix.target }}"
          sha256sum "dist/anvil-${{ matrix.target }}" > "dist/anvil-${{ matrix.target }}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Anvil ${{ github.ref_name }}
          body: |
            Anvil is a single static binary for Linux that reads the state of a
            homelab host and lets you change it, deliberately.

            ## What is in this release

            - **A rebuilt terminal interface.** Six tabs — Overview, Discovery,
              Storage, Runtime, Telemetry and Catalog — built on a tab manager
              and a reusable widget toolkit. Every number on screen comes from
              a real read of the host.
            - **Real mutations.** Container and service lifecycle actions go
              through a single controller: plan, confirm, execute, verify, and
              record a receipt with a rollback plan. A mutation needs root *and*
              `ANVIL_ALLOW_MUTATION=1` in the environment.
            - **A real application catalog.** A versioned TOML index with
              validation, an `anvil catalog` CLI, and a catalog tab. Installs
              are routed through the same controller as every other change.
            - **A real container API.** Docker and Podman are reached through
              the Docker API over their Unix socket (`bollard`, rustls), with
              the command line kept as the fallback for daemons without a
              socket. The receipt records which mechanism carried a change out.
            - **Honest data.** The interface no longer shows a fabricated
              process list or an unimplemented storage action menu.

            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/Crazygiscool/Anvil/main/scripts/install.sh | sh
            ```

            ## Verify

            Both binaries are statically linked against musl:

            ```sh
            file anvil-x86_64-unknown-linux-musl
            sha256sum -c anvil-x86_64-unknown-linux-musl.sha256
            ```

            ## Safety

            `apply` requires `--dry-run` and never changes the host. The
            inspection commands are read-only. Real mutations need root and
            `ANVIL_ALLOW_MUTATION=1`.
          files: |
            dist/anvil-${{ matrix.target }}
            dist/anvil-${{ matrix.target }}.sha256
